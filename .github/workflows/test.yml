name: tests
on:
  push: { branches: [main] }
  pull_request:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.9", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Run the suite (no dependencies to install)
        run: python3 tests/run.py
      - name: Installer must work from a clean checkout
        run: |
          RSB_PREFIX="$RUNNER_TEMP/bin" RAPP_SECOND_BRAIN_HOME="$RUNNER_TEMP/brain" bash install.sh
          "$RUNNER_TEMP/bin/rsb" --version
          RAPP_SECOND_BRAIN_HOME="$RUNNER_TEMP/brain" "$RUNNER_TEMP/bin/rsb" verify
